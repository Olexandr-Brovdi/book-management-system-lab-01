[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "book-management-system"
version = "0.1.0"
description = "Laboratory work 1, variant 2: book management"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Бровді Олександр"}]

[project.scripts]
book-manager = "book_manager.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"
